{% if requirements %}
<div class="project-requirement-list">
{% for item in requirements %}
<article class="project-requirement-row">
  <a href="/w/{{ workspace.name }}/requirements/input"><span><strong>{{ item.subject }} {{ item.predicate }} {{ item.object }}</strong><small>{{ item.id }}</small></span></a>
  <span class="status-badge {{ item.status }}">{{ item.status_label }}</span>
  <form method="post" action="/w/{{ workspace.name }}/requirements/entities/delete-preview"><input type="hidden" name="entity_type" value="requirement"><input type="hidden" name="entity_id" value="{{ item.id }}"><button class="button compact danger" type="submit">预览删除影响</button></form>
</article>
{% endfor %}
</div>
{% else %}
<div class="mini-empty">暂无需求。<a class="text-link" href="/w/{{ workspace.name }}/requirements/input">输入第一条需求 →</a></div>
{% endif %}
