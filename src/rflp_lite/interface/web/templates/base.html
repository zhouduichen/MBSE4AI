<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AI4MBSE Harness{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
  <script src="{{ url_for('static', path='/vendor/htmx.min.js') }}" defer></script>
</head>
<body>
  <header>
    <a href="/ui/projects">AI4MBSE Harness</a>
    <nav aria-label="主导航">
      <a href="/ui/projects">Projects</a>
      {% if project_id %}
      · <a href="/ui/projects/{{ project_id }}/analysis">Analysis</a>
      · <a href="/ui/projects/{{ project_id }}/model">MBSE Model</a>
      · <a href="/ui/projects/{{ project_id }}/evidence">Evidence &amp; Issues</a>
      {% endif %}
      · <a href="/ui/settings">Settings</a>
    </nav>
  </header>
  <main id="main-content">{% block content %}{% endblock %}</main>
</body>
</html>
