name: MBSE4AI Remote Evidence Collector

on:
  workflow_dispatch:
    inputs:
      campaign_id:
        description: "Remote campaign id, for example github-123456789"
        required: false
        type: string
  schedule:
    - cron: "47 * * * *"

permissions:
  contents: read

concurrency:
  group: mbse4ai-remote-evidence-collector
  cancel-in-progress: false

jobs:
  collect:
    name: remote LLM A–E evidence collector
    runs-on: [self-hosted, macOS, X64, remote-bridge, llm]
    # Keep scheduled runs observable even when repository configuration is
    # incomplete. A skipped scheduled job would look like a green no-op.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    env:
      AI4MBSE_LLM_PROFILE: ${{ vars.AI4MBSE_LLM_PROFILE }}
      AI4MBSE_REMOTE_CONTROLLER_STATE_ROOT: ${{ vars.AI4MBSE_REMOTE_CONTROLLER_STATE_ROOT || '/data/models/harness4h3-v27-code/evidence/student-campaign' }}
      AI4MBSE_REMOTE_CAMPAIGN_ROOT: ${{ vars.AI4MBSE_REMOTE_CAMPAIGN_ROOT || format('{0}/ai4mbse-campaigns', vars.AI4MBSE_REMOTE_CONTROLLER_STATE_ROOT || '/data/models/harness4h3-v27-code/evidence/student-campaign') }}
      AI4MBSE_REMOTE_SSH_TARGET: ${{ vars.AI4MBSE_REMOTE_SSH_TARGET }}
      AI4MBSE_REMOTE_SSH_HOST: ${{ vars.AI4MBSE_REMOTE_SSH_HOST }}
      AI4MBSE_REMOTE_SSH_PORT: ${{ vars.AI4MBSE_REMOTE_SSH_PORT || '22' }}
      AI4MBSE_REMOTE_SSH_USER: ${{ vars.AI4MBSE_REMOTE_SSH_USER }}
      AI4MBSE_REMOTE_SSH_JUMP_HOST: ${{ vars.AI4MBSE_REMOTE_SSH_JUMP_HOST }}
      AI4MBSE_REMOTE_SSH_JUMP_PORT: ${{ vars.AI4MBSE_REMOTE_SSH_JUMP_PORT || '22' }}
      AI4MBSE_REMOTE_SSH_JUMP_USER: ${{ vars.AI4MBSE_REMOTE_SSH_JUMP_USER }}
      AI4MBSE_REMOTE_SSH_PRIVATE_KEY: ${{ secrets.AI4MBSE_REMOTE_SSH_PRIVATE_KEY }}
      AI4MBSE_REMOTE_SSH_KNOWN_HOSTS: ${{ secrets.AI4MBSE_REMOTE_SSH_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH bridge to the GPU server
        run: |
          set -euo pipefail
          test -n "$AI4MBSE_REMOTE_SSH_TARGET"
          test -n "$AI4MBSE_REMOTE_SSH_PRIVATE_KEY"
          test -n "$AI4MBSE_REMOTE_SSH_KNOWN_HOSTS"
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$AI4MBSE_REMOTE_SSH_PRIVATE_KEY" > "$HOME/.ssh/ai4mbse-remote"
          printf '%s\n' "$AI4MBSE_REMOTE_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/ai4mbse-remote" "$HOME/.ssh/known_hosts"
          cat > "$HOME/.ssh/config" <<EOF
          Host $AI4MBSE_REMOTE_SSH_TARGET
            HostName $AI4MBSE_REMOTE_SSH_HOST
            Port $AI4MBSE_REMOTE_SSH_PORT
            User $AI4MBSE_REMOTE_SSH_USER
            IdentityFile $HOME/.ssh/ai4mbse-remote
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ProxyCommand ssh -i $HOME/.ssh/ai4mbse-remote -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes -W %h:%p -p $AI4MBSE_REMOTE_SSH_JUMP_PORT $AI4MBSE_REMOTE_SSH_JUMP_USER@$AI4MBSE_REMOTE_SSH_JUMP_HOST
          EOF
          ssh "$AI4MBSE_REMOTE_SSH_TARGET" 'hostname'
      - name: Collect one terminal campaign snapshot
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          local_root="$RUNNER_TEMP/ai4mbse-remote-collector"
          mkdir -p "$local_root"
          campaign_id='${{ inputs.campaign_id }}'
          if [ -z "$campaign_id" ]; then
            campaign_id=$(ssh "$AI4MBSE_REMOTE_SSH_TARGET" "find '$AI4MBSE_REMOTE_CAMPAIGN_ROOT' -mindepth 1 -maxdepth 1 -type d -name 'github-*' -printf '%T@ %f\\n' 2>/dev/null | sort -nr | head -n 1 | cut -d' ' -f2-")
          fi
          if [ -z "$campaign_id" ]; then
            printf '%s\n' '{"state":"no_campaign","evidence_ready":false}' > "$local_root/status.json"
            if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
              echo "::error::scheduled collector found no remote campaign; refusing to pass an empty evidence run"
              echo "- scheduled collector: FAIL (no remote campaign)" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "- manual collector: no remote campaign is available; recorded NO_CAMPAIGN" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          case "$campaign_id" in
            github-[0-9]*) ;;
            *) echo "invalid campaign id: $campaign_id" >&2; exit 1 ;;
          esac
          campaign_dir="$AI4MBSE_REMOTE_CAMPAIGN_ROOT/$campaign_id"
          ssh "$AI4MBSE_REMOTE_SSH_TARGET" "test -f '$campaign_dir/status.json'"
          scp "$AI4MBSE_REMOTE_SSH_TARGET:$campaign_dir/status.json" "$local_root/status.json"
          scp "$AI4MBSE_REMOTE_SSH_TARGET:$campaign_dir/manifest.json" "$local_root/manifest.json" || true
          if ssh "$AI4MBSE_REMOTE_SSH_TARGET" "test -d '$campaign_dir/results'"; then
            scp -r "$AI4MBSE_REMOTE_SSH_TARGET:$campaign_dir/results" "$local_root/"
          fi
          if ssh "$AI4MBSE_REMOTE_SSH_TARGET" "test -d '$campaign_dir/reports'"; then
            scp -r "$AI4MBSE_REMOTE_SSH_TARGET:$campaign_dir/reports" "$local_root/"
          fi
          python3 - "$local_root/status.json" "$local_root" <<'PY'
          import json
          from pathlib import Path
          import sys

          status_path = Path(sys.argv[1])
          root = Path(sys.argv[2])
          status = json.loads(status_path.read_text(encoding="utf-8"))
          state = status.get("state")
          if state == "running":
              print("- campaign is still running; this collector records PENDING, not PASS")
              raise SystemExit(0)
          if state != "completed":
              print(f"campaign terminal state is {state!r}: {status.get('error')}")
              raise SystemExit(1)
          profile = str(status.get("profile", ""))
          report = root / "reports" / "llm" / profile / "a_to_e_comparison.json"
          if not report.is_file():
              raise SystemExit(f"missing comparison report: {report}")
          comparison = json.loads(report.read_text(encoding="utf-8"))
          if comparison.get("status") != "PASS" or comparison.get("execution_complete") is not True:
              raise SystemExit("terminal campaign does not contain a complete PASS comparison")
          if comparison.get("invariant_failures") not in ([], None):
              raise SystemExit(f"comparison invariants failed: {comparison['invariant_failures']!r}")
          print("- terminal campaign contains a complete PASS comparison")
          PY
          echo "- collected campaign: ${campaign_id}" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload remote A–E campaign evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-remote-llm-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/ai4mbse-remote-collector
          if-no-files-found: ignore
