[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rflp-lite"
version = "0.1.0"
description = "Deterministic local RFLP vertical slice for AI-agent software engineering"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "hypothesis>=6.112",
  "import-linter>=2.1",
  "check-jsonschema>=0.30",
  "build>=1.2",
]
schema = ["jsonschema>=4.23"]
evidence = ["prance>=23.6.21", "junitparser>=3.2"]
opt = ["ortools>=9.11"]
tracking = ["mlflow>=2.0"]
web = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
]

[project.scripts]
rflp = "rflp_lite.interface.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rflp_lite.interface.web" = [
  "templates/*.html",
  "static/*.css",
  "static/vendor/*.js",
  "static/vendor/*.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
