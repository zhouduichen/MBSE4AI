[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rflp-lite"
version = "0.2.0"
description = "Deterministic local RFLP vertical slice for AI-agent software engineering"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "hypothesis>=6.112",
  "import-linter>=2.1",
  "check-jsonschema>=0.30",
  "build>=1.2",
  "ruff>=0.9",
]
schema = ["jsonschema>=4.23"]
documents = [
  "pdfplumber>=0.11,<1",
  "pypdfium2>=4.30,<5",
  "Pillow>=11,<13",
  "rapidocr>=3.6,<4",
  "onnxruntime>=1.22,<2",
]
web = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "keyring>=25",
]

[project.scripts]
rflp = "rflp_lite.interface.cli_v2:entrypoint"
ai4mbse = "rflp_lite.interface.cli_v2:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rflp_lite" = [
  "resources/schemas/*.json",
  "resources/prompts/**/*.md",
]
"rflp_lite.interface.web" = [
  "templates/*.html",
  "static/*.css",
  "static/vendor/*.js",
  "static/vendor/*.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "gpu: acceptance test requiring a visible NVIDIA GPU runner",
]
