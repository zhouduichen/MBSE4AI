[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rflp-lite"
version = "0.1.0"
description = "Deterministic local RFLP vertical slice for AI-agent software engineering"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "hypothesis>=6.112",
  "import-linter>=2.1",
  "check-jsonschema>=0.30",
  "build>=1.2",
]
schema = ["jsonschema>=4.23"]
evidence = ["prance>=23.6.21", "junitparser>=3.2"]
opt = ["ortools>=9.11"]
tracking = ["mlflow>=2.0"]
documents = [
  "pdfplumber>=0.11,<1",
  "pypdfium2>=4.30,<5",
  "Pillow>=11,<13",
  "rapidocr>=3.6,<4",
  "onnxruntime>=1.22,<2",
]
web = [
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "keyring>=25",
]
demo = [
  "pytest>=8.3",
  "hypothesis>=6.112",
  "jsonschema>=4.23",
  "prance>=23.6.21",
  "junitparser>=3.2",
  "ortools>=9.11",
  "pdfplumber>=0.11,<1",
  "pypdfium2>=4.30,<5",
  "Pillow>=11,<13",
  "rapidocr>=3.6,<4",
  "onnxruntime>=1.22,<2",
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "keyring>=25",
]
test-full = [
  "setuptools>=75",
  "wheel",
  "pytest>=8.3",
  "hypothesis>=6.112",
  "import-linter>=2.1",
  "check-jsonschema>=0.30",
  "build>=1.2",
  "jsonschema>=4.23",
  "prance>=23.6.21",
  "junitparser>=3.2",
  "ortools>=9.11",
  "mlflow>=2.0",
  "pdfplumber>=0.11,<1",
  "pypdfium2>=4.30,<5",
  "Pillow>=11,<13",
  "rapidocr>=3.6,<4",
  "onnxruntime>=1.22,<2",
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "keyring>=25",
  "ruff>=0.9",
  "pyright>=1.1",
]

[project.scripts]
rflp = "rflp_lite.interface.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"rflp_lite" = [
  "resources/schemas/*.json",
  "resources/domain/*.json",
  "resources/domain-packs/*.json",
  "resources/examples/customer-acceptance/*",
  "resources/examples/versioned-content-service/*",
  "resources/examples/concept-design/*.json",
  "resources/examples/discovery/*",
]
"rflp_lite.interface.web" = [
  "templates/*.html",
  "static/*.css",
  "static/vendor/*.js",
  "static/vendor/*.txt",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
